# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the 
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # The available themes options are "default", "air", "sunrise", "mint", "dirt" and "contrast"
title                    : "Brian K Chen"
title_separator          : "-"
name                     : &name "Brian K Chen"
description              : &description "Research in efficient language models, long-context inference, diffusion language models, and model expressivity."
url        : "https://bkchenus.github.io"
baseurl    : "/brian-k-chen"
repository : "BKCheNUS/brian-k-chen"


# Site Author - The following control what appear as part of the author content on the side bar.
#               If a field is blank the icon and link will not appear, otherwise it will be shown.
#               Additional customization can be done by editing /_includes/author-profile.html
author:
  # Biographic information
  avatar           : # TODO: Add your headshot to images/ and set e.g. "profile.png"
  name             : "Brian K Chen"
  pronouns         : "he/him"  
  bio              : "Machine learning researcher (PhD, NUS; MMath, Oxford) studying efficient LLM inference, long-context memory, diffusion language models, and model expressivity."
  location         : "Hong Kong"
  employer         : Polyadic Intelligence
  uri              : # URL
  email            : "briankchenworc@gmail.com"

  # Academic websites
  academia         : # URL
  arxiv            : # URL - Update with the correct link to your profile
  googlescholar    : "https://scholar.google.com/citations?user=XAOF028AAAAJ"
  inspire-hep      : # URL
  impactstory      : # URL
  orcid            : # TODO: Add your ORCID profile URL, if you have one
  semantic         : # URL
  ssrn             : # URL
  pubmed           : # Optional: Leave blank unless you want a PubMed author-search link
  researchgate     : # URL
  scopus           : # URL
  zotero           : # URL


  # Repositories and software development
  bitbucket        : # Username - Update with your username on the site
  codepen          : # Username
  dribbble         : # Username
  github           : "BKCheNUS"
  kaggle           : # Username  
  stackoverflow    : # User number or user number and name (i.e., use "1" or "1/jeff-atwood")    

  # Social media
  artstation       : # Username
  bluesky          : # Add your Bluesky username only if you use it
  facebook         : # Username
  flickr           : # Username
  foursquare       : # Username
  goodreads        : # Username
  google_plus      : # Username
  keybase          : # Username
  instagram        : # Username
  lastfm           : # Username
  linkedin         : # Username
  mastodon         : # URL
  medium           : # URL
  pinterest        : # Username
  soundcloud       : # Username
  steam            : # Username
  telegram         : # URL
  tumblr           : # Username
  twitter          : # Username for X / Twitter
  vine             : # Username
  weibo            : # Username
  wikipedia        : # Username
  xing             : # Username
  youtube          : # Username
  zhihu            : # Username

# Publication Category - The following the list of publication categories and their headings
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'    
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :  # filename of teaser fallback teaser image placed in /images/ for social media previews
breadcrumbs              : false # true, false (default)
